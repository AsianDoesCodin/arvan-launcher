appId: 'arvanrpglauncher'
productName: 'Arvan RPG'
artifactName: 'ArvanRPG-Setup-${version}.${ext}' # Arvan: no spaces (electron-updater / GitHub asset names)

copyright: 'Copyright © 2026 AsianDoesCodin. Based on HeliosLauncher © 2018-2026 Daniel Scalzi (MIT)'

# Arvan: self-update from GitHub releases (stable only).
publish:
  provider: 'github'
  owner: 'AsianDoesCodin'
  repo: 'arvan-launcher'
  releaseType: 'release'

afterPack: './build/arvan-afterpack.js' # Arvan: stamps the crest icon into the exe

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'build/icon.ico' # Arvan crest
  signAndEditExecutable: false # Arvan: avoids winCodeSign symlink extraction (needs admin/dev mode)
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: 'build/icon.ico'
  uninstallerIcon: 'build/icon.ico'
  installerHeaderIcon: 'build/icon.ico'
  createDesktopShortcut: true
  shortcutName: 'Arvan RPG'

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'